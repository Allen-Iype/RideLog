version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: ridelog_postgres
    environment:
      POSTGRES_USER: ridelog
      POSTGRES_PASSWORD: ridelog_dev_password
      POSTGRES_DB: ridelog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridelog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ridelog_network

networks:
  ridelog_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
